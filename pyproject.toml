[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wordle-ai"
dynamic = ["version"]
description = "Wordle-solving AI: measured solver, benchmark harness and play assistant"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Wordle AI Contributors"}
]
keywords = ["wordle", "ai", "solver", "dynamic-programming", "information-theory", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Puzzle Games",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/MdHussain121/wordle-ai"
Issues = "https://github.com/MdHussain121/wordle-ai/issues"
Documentation = "https://github.com/MdHussain121/wordle-ai#readme"
Changelog = "https://github.com/MdHussain121/wordle-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
]
prior = [
  "wordfreq>=3.1",
]
http = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# Phase 6 ML experimentation dependencies
ml = [
  "joblib>=1.3",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "pyarrow>=15.0",
]
# Reserved: the measured budgets do not justify a Rust kernel (see the roadmap).
rust = []

[project.scripts]
wordle-ai = "wordle_ai.cli.main:app"

[tool.hatch.version]
path = "src/wordle_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wordle_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:wordle_ai.*"]
