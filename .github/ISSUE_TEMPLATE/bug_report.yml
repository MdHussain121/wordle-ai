name: Bug Report
description: Create a report to help us improve Wordle AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
        **Note:** Do not paste proprietary or full Wordle solution wordlists here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Run command 'wordle-ai play --profile classic.en.5'
        2. Enter guess 'salet'
        3. Encounter error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, Node.js version, wordle-ai version.
      placeholder: "e.g. Windows 11 / Ubuntu 24.04, Python 3.12.3, wordle-ai v0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      render: shell
